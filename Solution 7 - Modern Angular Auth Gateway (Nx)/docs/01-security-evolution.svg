<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><rect width="100%" height="100%" rx="28" fill="#F8FAFC"/><text x="90" y="95" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="54" font-weight="800" fill="#0F172A">The evolution of security in Angular apps</text><text x="90" y="145" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="28" fill="#475569">From OAuth tokens in the browser to a server-side BFF/auth gateway</text><rect x="90" y="220" width="430" height="500" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/><rect x="118" y="248" width="110" height="52" rx="26" fill="#E0F2FE"/><text x="173" y="283" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#DC2626" text-anchor="middle">2018</text><text x="118" y="345" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="800" fill="#0F172A">Implicit flow</text><text x="118" y="392" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="23" fill="#475569">Tokens returned through the browser</text><rect x="135" y="455" width="120" height="80" rx="16" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="195" y="505" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="middle">Angular</text><rect x="335" y="455" width="120" height="80" rx="16" fill="#FFF7ED" stroke="#CBD5E1" stroke-width="2"/><text x="395" y="505" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">API</text><line x1="255" y1="495" x2="335" y2="495" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="295" y="478" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="18" fill="#475569" text-anchor="middle">Bearer</text><text x="295" y="552" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">access token</text><text x="305" y="688" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#DC2626" text-anchor="middle">Browser owns OAuth</text><rect x="565" y="220" width="430" height="500" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/><rect x="593" y="248" width="110" height="52" rx="26" fill="#E0F2FE"/><text x="648" y="283" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#D97706" text-anchor="middle">2019</text><text x="593" y="345" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="800" fill="#0F172A">Authorization Code + PKCE</text><text x="593" y="392" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="23" fill="#475569">Safer authorization-code exchange</text><rect x="610" y="455" width="120" height="80" rx="16" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="670" y="505" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="middle">Angular</text><rect x="810" y="455" width="120" height="80" rx="16" fill="#FFF7ED" stroke="#CBD5E1" stroke-width="2"/><text x="870" y="505" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">API</text><line x1="730" y1="495" x2="810" y2="495" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="770" y="478" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="18" fill="#475569" text-anchor="middle">Bearer</text><text x="770" y="552" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#D97706" text-anchor="middle">access token</text><text x="780" y="688" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#D97706" text-anchor="middle">Tokens still live in browser</text><rect x="1040" y="220" width="430" height="500" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/><rect x="1068" y="248" width="110" height="52" rx="26" fill="#E0F2FE"/><text x="1123" y="283" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#16A34A" text-anchor="middle">2026</text><text x="1068" y="345" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="34" font-weight="800" fill="#0F172A">BFF / Auth Gateway</text><text x="1068" y="392" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="23" fill="#475569">OAuth client moves to server</text><rect x="1085" y="455" width="120" height="80" rx="16" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="2"/><text x="1145" y="505" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="middle">Angular</text><rect x="1260" y="435" width="160" height="120" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="1340" y="480" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="800" fill="#2563EB" text-anchor="middle">Auth</text><text x="1340" y="512" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="800" fill="#2563EB" text-anchor="middle">Gateway</text><line x1="1205" y1="495" x2="1260" y2="495" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="1232" y="478" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="18" fill="#475569" text-anchor="middle">session</text><rect x="1260" y="585" width="160" height="70" rx="16" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/><text x="1340" y="628" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#16A34A" text-anchor="middle">OAuth tokens</text><line x1="1340" y1="555" x2="1340" y2="585" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="1255" y="688" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#16A34A" text-anchor="middle">Browser gets only a session</text><line x1="525" y1="470" x2="555" y2="470" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/><line x1="1000" y1="470" x2="1030" y2="470" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/><text x="800" y="805" font-family="Inter,Arial,DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#0F172A" text-anchor="middle">The key change: Angular no longer needs to possess OAuth access or refresh tokens.</text></svg>