<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker></defs><rect width="1600" height="900" rx="28" fill="#f8fafc"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="50" font-weight="800" fill="#0f172a">Local developer experience: same topology as production</text><text x="80" y="140" font-family="Arial,sans-serif" font-size="28" fill="#475569">Open one gateway origin and let it proxy Nx dev servers, API, and auth</text><g font-family="Arial,sans-serif"><rect x="80" y="330" width="220" height="160" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="190" y="390" font-size="30" font-weight="800" fill="#2563eb" text-anchor="middle">Browser</text><text x="190" y="430" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">localhost:8080</text><text x="190" y="463" font-size="18" fill="#475569" text-anchor="middle">only URL you open</text><rect x="430" y="265" width="310" height="290" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="585" y="330" font-size="31" font-weight="800" fill="#2563eb" text-anchor="middle">Local Auth Gateway</text><text x="585" y="372" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">localhost:8080</text><text x="585" y="420" font-size="20" fill="#475569" text-anchor="middle">/ → shell</text><text x="585" y="455" font-size="20" fill="#475569" text-anchor="middle">/orders → MFE</text><text x="585" y="490" font-size="20" fill="#475569" text-anchor="middle">/api → API</text><g font-size="25" font-weight="800" fill="#0f172a" text-anchor="middle"><rect x="920" y="230" width="240" height="100" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1040" y="272">Shell</text><text x="1040" y="303" font-size="19" fill="#475569">4200</text><rect x="920" y="365" width="240" height="100" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1040" y="407">Orders MFE</text><text x="1040" y="438" font-size="19" fill="#475569">4201</text><rect x="920" y="500" width="240" height="100" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="1040" y="542">Orders API</text><text x="1040" y="573" font-size="19" fill="#475569">4300</text><rect x="1260" y="300" width="240" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1380" y="342">Keycloak</text><text x="1380" y="373" font-size="19" fill="#475569">8081</text><rect x="1260" y="480" width="240" height="100" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="1380" y="522">Redis</text><text x="1380" y="553" font-size="19" fill="#475569">6379</text></g><g stroke="#475569" stroke-width="4" marker-end="url(#a)"><line x1="300" y1="410" x2="430" y2="410"/><line x1="740" y1="410" x2="920" y2="280"/><line x1="740" y1="410" x2="920" y2="415"/><line x1="740" y1="410" x2="920" y2="550"/></g><line x1="740" y1="340" x2="1260" y2="350" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><text x="1000" y="322" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="middle">OIDC redirects</text><line x1="740" y1="485" x2="1260" y2="530" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><text x="1000" y="520" font-size="18" font-weight="700" fill="#16a34a" text-anchor="middle">shared session state</text><rect x="160" y="700" width="1280" height="110" rx="20" fill="#0f172a"/><text x="800" y="748" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">Why this is nice for DX</text><text x="800" y="785" font-size="23" fill="#e2e8f0" text-anchor="middle">Deep links, cookies, OIDC callbacks and same-origin API calls behave locally like they do in production.</text></g></svg>