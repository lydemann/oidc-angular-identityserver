<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/></filter></defs><rect width="1600" height="900" rx="28" fill="#f8fafc"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="54" font-weight="800" fill="#0f172a">Modern Angular security architecture</text><text x="80" y="140" font-family="Arial,sans-serif" font-size="28" fill="#475569">One browser origin, server-side OAuth, fixed routing to microfrontends and APIs</text><g filter="url(#s)"><rect x="80" y="330" width="190" height="130" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="350" y="300" width="230" height="190" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="680" y="250" width="330" height="300" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="1120" y="230" width="360" height="110" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="1120" y="390" width="360" height="110" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="1120" y="550" width="360" height="110" rx="20" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><rect x="700" y="650" width="250" height="100" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="1030" y="680" width="230" height="100" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/></g><text x="175" y="385" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#2563eb" text-anchor="middle">Browser</text><text x="175" y="425" font-family="Arial,sans-serif" font-size="20" fill="#475569" text-anchor="middle">Angular shell + MFEs</text><text x="465" y="360" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">SaaS Gateway</text><text x="465" y="405" font-family="Arial,sans-serif" font-size="19" fill="#475569" text-anchor="middle">WAF • TLS • throttling</text><text x="465" y="438" font-family="Arial,sans-serif" font-size="19" fill="#475569" text-anchor="middle">optional edge layer</text><text x="845" y="320" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#2563eb" text-anchor="middle">Auth Gateway / BFF</text><text x="845" y="365" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Confidential OIDC client</text><text x="845" y="415" font-family="Arial,sans-serif" font-size="22" fill="#475569" text-anchor="middle">session cookie • token lifecycle</text><text x="845" y="455" font-family="Arial,sans-serif" font-size="22" fill="#475569" text-anchor="middle">fixed route mappings</text><text x="845" y="495" font-family="Arial,sans-serif" font-size="22" fill="#475569" text-anchor="middle">server-side API token injection</text><text x="1300" y="275" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">Angular Shell</text><text x="1300" y="315" font-family="Arial,sans-serif" font-size="19" fill="#475569" text-anchor="middle">document + assets</text><text x="1300" y="435" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">Orders MFE</text><text x="1300" y="475" font-family="Arial,sans-serif" font-size="19" fill="#475569" text-anchor="middle">document + assets</text><text x="1300" y="595" font-family="Arial,sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">Orders API</text><text x="1300" y="635" font-family="Arial,sans-serif" font-size="19" fill="#475569" text-anchor="middle">protected resource</text><text x="825" y="695" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#7c3aed" text-anchor="middle">Keycloak</text><text x="825" y="727" font-family="Arial,sans-serif" font-size="18" fill="#475569" text-anchor="middle">Authorization Server</text><text x="1145" y="725" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#16a34a" text-anchor="middle">Redis</text><text x="1145" y="757" font-family="Arial,sans-serif" font-size="18" fill="#475569" text-anchor="middle">sessions + login tx</text><g stroke="#475569" stroke-width="4" marker-end="url(#a)"><line x1="270" y1="395" x2="350" y2="395"/><line x1="580" y1="395" x2="680" y2="395"/><line x1="1010" y1="395" x2="1120" y2="285"/><line x1="1010" y1="395" x2="1120" y2="445"/><line x1="1010" y1="395" x2="1120" y2="605"/><line x1="845" y1="550" x2="825" y2="650"/><line x1="950" y1="520" x2="1080" y2="680"/></g><rect x="180" y="815" width="1240" height="58" rx="18" fill="#0f172a"/><text x="800" y="853" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#fff" text-anchor="middle">Browser: HttpOnly session cookie   •   Server: access / refresh tokens</text></svg>