<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="60" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a">BFF / Auth Gateway: the browser gets a session</text>

  <rect x="70" y="150" width="250" height="180" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="195" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#2563eb">Angular</text>
  <text x="195" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">HttpOnly session</text>

  <rect x="455" y="125" width="290" height="230" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="600" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1d4ed8">Auth Gateway / BFF</text>
  <text x="600" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">OAuth client + token lifecycle</text>

  <rect x="880" y="150" width="250" height="180" rx="20" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="1005" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15803d">Protected API</text>
  <text x="1005" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">resource server</text>

  <line x1="320" y1="240" x2="450" y2="240" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <line x1="745" y1="240" x2="875" y2="240" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="810" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#15803d">Bearer access token</text>

  <text x="600" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">OAuth access and refresh tokens stay on the server.</text>
</svg>