<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker></defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="60" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a">Traditional server-side session</text>
  
  <rect x="70" y="140" width="250" height="190" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="195" y="200" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#2563eb">Browser</text>
  <text x="195" y="245" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">session_id cookie</text>
  <rect x="475" y="140" width="250" height="190" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="600" y="200" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#c2410c">Web server</text>
  <text x="600" y="245" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">validates session</text>
  <rect x="880" y="140" width="250" height="190" rx="20" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="1005" y="200" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#15803d">Session store</text>
  <text x="1005" y="245" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">user + expiry</text>
  <line x1="320" y1="235" x2="470" y2="235" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
  <line x1="725" y1="235" x2="875" y2="235" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
  <text x="600" y="420" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">The browser carries only a session identifier. Authentication state stays on the server.</text>
</svg>