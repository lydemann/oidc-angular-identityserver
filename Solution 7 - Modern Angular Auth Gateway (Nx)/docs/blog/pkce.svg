<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker></defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="60" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a">PKCE protects the authorization-code exchange</text>
  
  <circle cx="110" cy="145" r="26" fill="#2563eb"/><text x="110" y="153" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">1</text><text x="155" y="152" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Generate code_verifier</text><circle cx="110" cy="215" r="26" fill="#f97316"/><text x="110" y="223" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">2</text><text x="155" y="222" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Derive S256 code_challenge</text><circle cx="110" cy="285" r="26" fill="#2563eb"/><text x="110" y="293" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">3</text><text x="155" y="292" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Authorize with code_challenge</text><circle cx="650" cy="145" r="26" fill="#f97316"/><text x="650" y="153" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">4</text><text x="695" y="152" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Receive authorization code</text><circle cx="650" cy="215" r="26" fill="#2563eb"/><text x="650" y="223" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">5</text><text x="695" y="222" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Redeem code + code_verifier</text><circle cx="650" cy="285" r="26" fill="#16a34a"/><text x="650" y="293" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#fff">6</text><text x="695" y="292" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Server verifies and returns tokens</text>
  <rect x="130" y="360" width="940" height="95" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="600" y="398" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#dc2626">An intercepted code is not enough</text>
  <text x="600" y="430" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Without the original code_verifier, the attacker cannot redeem the authorization code.</text>
</svg>