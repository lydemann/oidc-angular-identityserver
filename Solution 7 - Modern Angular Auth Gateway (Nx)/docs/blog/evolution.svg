<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker></defs>
<rect width="1600" height="900" rx="28" fill="#f8fafc"/>
<text x="85" y="95" font-family="Arial,sans-serif" font-size="54" font-weight="800" fill="#0f172a">The evolution of security in Angular apps</text>
<text x="85" y="145" font-family="Arial,sans-serif" font-size="28" fill="#475569">From OAuth tokens in the browser to a server-side BFF/auth gateway</text>
<rect x="65" y="225" width="440" height="500" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="95" y="285" font-family="Arial" font-size="22" font-weight="700" fill="#dc2626">2012</text><text x="95" y="345" font-family="Arial" font-size="34" font-weight="800" fill="#0f172a">Implicit flow</text><text x="95" y="392" font-family="Arial" font-size="23" fill="#475569">Tokens returned through the browser</text>
<rect x="115" y="455" width="120" height="80" rx="16" fill="#eff6ff"/><text x="175" y="505" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2563eb">Angular</text><rect x="320" y="455" width="120" height="80" rx="16" fill="#fff7ed"/><text x="380" y="505" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">API</text><line x1="235" y1="495" x2="315" y2="495" stroke="#475569" stroke-width="4" marker-end="url(#a)"/><text x="278" y="552" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#dc2626">access token</text>
<text x="285" y="665" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#dc2626">Access token transferred</text><text x="285" y="695" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#dc2626">through browser URL</text>
<rect x="580" y="225" width="440" height="500" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="610" y="285" font-family="Arial" font-size="22" font-weight="700" fill="#d97706">2015</text><text x="610" y="338" font-family="Arial" font-size="30" font-weight="800" fill="#0f172a">Authorization Code</text><text x="610" y="374" font-family="Arial" font-size="30" font-weight="800" fill="#0f172a">+ PKCE</text><text x="610" y="414" font-family="Arial" font-size="21" fill="#475569">Safer authorization-code exchange</text>
<rect x="635" y="455" width="120" height="80" rx="16" fill="#eff6ff"/><text x="695" y="505" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2563eb">Angular</text><rect x="835" y="455" width="120" height="80" rx="16" fill="#fff7ed"/><text x="895" y="505" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">API</text><line x1="755" y1="495" x2="830" y2="495" stroke="#475569" stroke-width="4" marker-end="url(#a)"/><text x="795" y="552" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#d97706">access token</text><text x="800" y="695" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#d97706">Tokens still live in browser</text>
<rect x="1095" y="225" width="440" height="500" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1125" y="285" font-family="Arial" font-size="22" font-weight="700" fill="#16a34a">2025-2026</text><text x="1125" y="345" font-family="Arial" font-size="34" font-weight="800" fill="#0f172a">BFF / Auth Gateway</text><text x="1125" y="392" font-family="Arial" font-size="23" fill="#475569">OAuth client moves to server</text>
<rect x="1140" y="455" width="120" height="80" rx="16" fill="#eff6ff"/><text x="1200" y="505" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#2563eb">Angular</text><rect x="1320" y="435" width="160" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1400" y="482" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#2563eb">Auth</text><text x="1400" y="514" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#2563eb">Gateway</text><line x1="1260" y1="495" x2="1315" y2="495" stroke="#475569" stroke-width="4" marker-end="url(#a)"/><rect x="1320" y="585" width="160" height="70" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="1400" y="628" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#16a34a">OAuth tokens</text><text x="1315" y="695" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#16a34a">Browser gets only a session</text>
<text x="800" y="815" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">The key change: Angular no longer needs to possess OAuth access or refresh tokens.</text>
</svg>