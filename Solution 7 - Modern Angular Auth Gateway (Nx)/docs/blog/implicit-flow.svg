<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#2563eb"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#dc2626"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#16a34a"/></marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fafc"/>
  <text x="60" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a">Implicit flow: access token in the front channel</text>

  <rect x="70" y="150" width="250" height="180" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="195" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#2563eb">Browser SPA</text>

  <rect x="475" y="135" width="250" height="170" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="600" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#c2410c">Authorization server</text>

  <rect x="880" y="150" width="250" height="180" rx="20" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="1005" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#15803d">API</text>

  <line x1="320" y1="190" x2="470" y2="190" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="395" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2563eb">authorize</text>

  <line x1="475" y1="275" x2="325" y2="275" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="400" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#dc2626">redirect + access token</text>

  <line x1="320" y1="365" x2="875" y2="365" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="600" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#15803d">Bearer token to API</text>

  <text x="600" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0f172a">The access token is transferred through the browser-facing redirect URL.</text>
</svg>