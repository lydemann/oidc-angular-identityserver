<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker></defs><rect width="1600" height="900" rx="28" fill="#f8fafc"/><text x="80" y="90" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#0f172a">Direct microfrontend URL: keep the deep link</text><text x="80" y="140" font-family="Arial,sans-serif" font-size="28" fill="#475569">The auth gateway owns navigation before and after OIDC login</text><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="80" y="205" width="200" height="74" rx="18"/><rect x="440" y="205" width="200" height="74" rx="18"/><rect x="800" y="205" width="200" height="74" rx="18"/><rect x="1160" y="205" width="200" height="74" rx="18"/></g><g font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle"><text x="180" y="252">Browser</text><text x="540" y="252">Auth Gateway</text><text x="900" y="252">Keycloak</text><text x="1260" y="252">Orders MFE</text></g><g stroke="#cbd5e1" stroke-width="3" stroke-dasharray="8 8"><line x1="180" y1="280" x2="180" y2="760"/><line x1="540" y1="280" x2="540" y2="760"/><line x1="900" y1="280" x2="900" y2="760"/><line x1="1260" y1="280" x2="1260" y2="760"/></g><g stroke-width="4" marker-end="url(#a)"><line x1="180" y1="330" x2="540" y2="330" stroke="#2563eb"/><line x1="540" y1="400" x2="180" y2="400" stroke="#475569"/><line x1="180" y1="470" x2="540" y2="470" stroke="#2563eb"/><line x1="540" y1="540" x2="900" y2="540" stroke="#7c3aed"/><line x1="900" y1="610" x2="540" y2="610" stroke="#7c3aed"/><line x1="540" y1="680" x2="180" y2="680" stroke="#16a34a"/><line x1="180" y1="750" x2="1260" y2="750" stroke="#2563eb"/></g><g font-size="19" font-weight="700" text-anchor="middle"><text x="360" y="316" fill="#2563eb">GET /orders/123</text><text x="360" y="386" fill="#475569">302 /auth/login?returnTo=/orders/123</text><text x="360" y="456" fill="#2563eb">GET /auth/login</text><text x="720" y="526" fill="#7c3aed">302 authorization request (code + PKCE)</text><text x="720" y="596" fill="#7c3aed">GET /auth/callback?code=…</text><text x="360" y="666" fill="#16a34a">Set-Cookie: HttpOnly session + 302 /orders/123</text><text x="720" y="736" fill="#2563eb">GET /orders/123 through gateway</text></g><rect x="355" y="790" width="890" height="70" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="800" y="835" font-size="26" font-weight="800" fill="#16a34a" text-anchor="middle">Validated local returnTo only — never an arbitrary external redirect.</text></g></svg>